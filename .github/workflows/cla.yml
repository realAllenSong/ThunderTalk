# Asks every outside contributor to sign CLA.md before a pull request can be merged, and records
# signatures in signatures/cla.json on the cla-signatures branch. Runs on pull_request_target
# without checking out the pull request's code.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        # v2.6.1
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/realAllenSong/ThunderTalk/blob/main/CLA.md
          branch: cla-signatures
          allowlist: realAllenSong,dependabot[bot],github-actions[bot]
          create-file-commit-message: Create the CLA signature file
          signed-commit-message: "$contributorName signed the CLA in #$pullRequestNo"
          custom-notsigned-prcomment: >-
            Thanks for your pull request. Before it can be merged, please read the
            [Contributor License Agreement](https://github.com/realAllenSong/ThunderTalk/blob/main/CLA.md)
            and sign it by posting the comment below. You only sign once.
          custom-allsigned-prcomment: All contributors have signed the CLA. Thank you.
